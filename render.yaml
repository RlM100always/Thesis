services:
  - type: web
    name: thesis
    runtime: docker
    repo: https://github.com/RlM100always/Thesis
    branch: main
    plan: 0.5c-512mb
    region: singapore
    dockerContext: .
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: jwt
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: thesis-db
          property: connectionString
      - key: PUBLIC_APP_URL
        value: https://thesis-j0n8.onrender.com
      - key: INTEGRATION_MODE
        value: sandbox
      - key: PRESENTATION_DEMO_ENABLED
        value: "false"
      - key: BSMART_BOOTSTRAP_DEMO_CATALOG
        value: "NO"

databases:
  - name: thesis-db
    plan: 0.5c-1g
    region: singapore
    ipAllowList: []
