name: B-SMART Cloudflare D1 Read-only Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'frontend/src/api.js'
      - 'frontend/src/pages/Store.jsx'
      - '.github/workflows/cloudflare-d1-live-smoke.yml'

jobs:
  d1-live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      D1_API: https://bsmart-commerce-api.bcs-written-rakib.workers.dev
    steps:
      - name: Check Worker and public D1 catalogue counts
        run: |
          curl -fLsS --retry 4 --retry-delay 2 --max-time 18 "$D1_API/health" > health.json
          node -e 'const h=require("./health.json");if(h.status!=="ok"||h.database!=="Cloudflare D1"||h.scope!=="public_storefronts"||h.stores!==0||h.products!==0||h.assistant_enabled!==true)process.exit(1);console.log("D1 healthy; no unverified/sample stores are public; Workers AI binding is enabled")'
      - name: Check password authentication capability
        run: |
          curl -fLsS --max-time 25 "$D1_API/api/merchant/health" > merchant-health.json
          node -e 'const x=require("./merchant-health.json");if(x.status!=="ok"||!x.password_auth_ready||x.password_hash!=="PBKDF2-HMAC-SHA-256"||x.password_iterations!==100000||!x.legacy_access_key_support||typeof x.email_verification_configured!=="boolean"||typeof x.password_reset_configured!=="boolean")process.exit(1);console.log("PBKDF2 auth ready; email verification configured: "+x.email_verification_configured)'
      - name: Verify Cloudflare CORS for B-SMART website
        run: |
          curl -fsSI --max-time 18 -X OPTIONS \
            -H "Origin: https://thesis-j0n8.onrender.com" \
            -H "Access-Control-Request-Method: POST" \
            "$D1_API/api/public/orders/demo-bsmart-grocery" > headers.txt
          grep -iq '^access-control-allow-origin: https://thesis-j0n8.onrender.com' headers.txt
          grep -iq '^access-control-allow-methods:.*POST' headers.txt
      - name: Check public store directory excludes retained CI fixture
        run: |
          curl -fLsS --retry 3 --max-time 18 "$D1_API/api/public/store/" > stores.json
          node -e 'const s=require("./stores.json");if(!Array.isArray(s)||s.length!==0)process.exit(1);console.log("Verified public directory contains no inactive sample or CI stores")'
      - name: Check public D1 diagnostics
        run: |
          curl -fLsS --retry 3 --max-time 18 "$D1_API/api/public/store/diagnostics" > diagnostics.json
          node -e 'const x=require("./diagnostics.json");if(x.active_stores!==0||x.listed_products!==0||x.catalog_ready!==false)process.exit(1);console.log("D1 diagnostics confirm no unverified stores are publicly listed")'
      - name: Check individual catalogue and stock
        run: |
          status=$(curl -sS --max-time 18 -o shop.json -w "%{http_code}" "$D1_API/api/public/store/slug/demo-bsmart-grocery")
          test "$status" = "404"
          node -e 'const x=require("./shop.json");if(!x.detail||!String(x.detail).includes("Store"))process.exit(1);console.log("Inactive sample store is correctly unavailable to the public")'
      - name: Check owner assistant requires an authenticated owner
        run: |
          status=$(curl -sS --max-time 18 -o assistant.json -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"question":"আজকের বিক্রি"}' "$D1_API/api/merchant/assistant")
          test "$status" = "401"
          node -e 'const x=require("./assistant.json");if(!x.detail)process.exit(1);console.log("Owner assistant correctly rejects unauthenticated requests")'

# This workflow intentionally performs read-only checks against production D1.
# Write/checkout/POS scenarios belong in local D1 mocks or an isolated staging DB;
# never leave CI owners, orders, stock movements or cashbook rows in production.
