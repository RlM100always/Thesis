name: B-SMART Cloudflare D1 Live Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'frontend/src/api.js'
      - 'frontend/src/pages/Store.jsx'
      - '.github/workflows/cloudflare-d1-live-smoke.yml'

jobs:
  d1-live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      D1_API: https://bsmart-commerce-api.bcs-written-rakib.workers.dev
    steps:
      - name: Check Worker /health
        run: |
          curl -fLsS --retry 4 --retry-delay 2 --max-time 18 "$D1_API/health" > health.json
          node -e 'const h=require("./health.json");if(h.database!=="Cloudflare D1"||h.stores!==10||h.products<250)process.exit(1); console.log("D1 stores="+h.stores+" products="+h.products)'
      - name: Check published store directory
        run: |
          curl -fLsS --retry 3 --max-time 18 "$D1_API/api/public/store/" > stores.json
          node -e 'const s=require("./stores.json");if(!Array.isArray(s)||s.length!==10||s.some(x=>!x.is_demo||!x.slug))process.exit(1);console.log("Verified "+s.length+" safely labelled demo stores")'
      - name: Check individual catalog and stock
        run: |
          curl -fLsS --retry 3 --max-time 18 "$D1_API/api/public/store/slug/demo-bsmart-grocery" > shop.json
          node -e 'const s=require("./shop.json");if(s.slug!=="demo-bsmart-grocery"||s.products.length<20||s.products.some(p=>typeof p.price!=="number"||typeof p.in_stock!=="boolean"))process.exit(1);console.log("Verified "+s.products.length+" product catalog entries")'

      - name: One-time Cloudflare D1 demo checkout + token-status verification
        if: contains(github.event.head_commit.message, '[checkout-e2e]')
        run: |
          cat > /tmp/d1-demo-order.json <<'JSON'
          {"shipping_name":"TEST ONLY","shipping_phone":"01700000000","shipping_address":"Fictional address","payment_method":"cod","items":[{"product_id":"demo-grocery-RICE5","quantity":1}]}
          JSON
          curl -fLsS --max-time 20 -X POST -H 'Content-Type: application/json' \
            --data-binary @/tmp/d1-demo-order.json "$D1_API/api/public/orders/demo-bsmart-grocery" > order.json
          node -e 'const o=require("./order.json");if(!o.access_token||o.status!=="placed"||o.organization_id!=="demo-bsmart-grocery"||o.total<=0)process.exit(1);console.log("D1 accepted demo order "+o.order_number)'
          TOKEN="$(node -p 'require("./order.json").access_token')"
          curl -fLsS --max-time 20 "$D1_API/api/public/orders/demo-bsmart-grocery/status/$TOKEN" > tracked.json
          node -e 'const x=require("./tracked.json"),o=require("./order.json");if(x.order_number!==o.order_number||x.total!==o.total||x.items.length!==1)process.exit(1);console.log("D1 durable order tracking verified")'

      - name: One-time D1 v2 customer, inventory and cancellation E2E test
        if: contains(github.event.head_commit.message, '[d1-v2-e2e]')
        run: |
          curl -fLsS --max-time 20 "$D1_API/api/public/store/slug/demo-bsmart-grocery" > before.json
          cat > /tmp/d1-v2-order.json <<'JSON'
          {"shipping_name":"FAKE TEST","shipping_phone":"01700000000","shipping_address":"Not an actual address","payment_method":"cod","items":[{"product_id":"demo-grocery-DAL1","quantity":1}]}
          JSON
          curl -fLsS --max-time 20 -X POST -H 'Content-Type: application/json' \
            --data-binary @/tmp/d1-v2-order.json "$D1_API/api/public/orders/demo-bsmart-grocery" > created.json
          node -e 'const o=require("./created.json");if(o.status!=="placed"||!o.access_token||o.items.length!==1)process.exit(1);console.log("D1 v2 transactional order created")'
          TOKEN="$(node -p 'require("./created.json").access_token')"
          curl -fLsS --max-time 20 -X POST \
            "$D1_API/api/public/orders/demo-bsmart-grocery/cancel/$TOKEN" > cancelled.json
          node -e 'const o=require("./cancelled.json");if(o.status!=="cancelled")process.exit(1);console.log("D1 cancellation persisted")'
          curl -fLsS --max-time 20 "$D1_API/api/public/store/slug/demo-bsmart-grocery" > after.json
          node -e 'const a=require("./before.json").products.find(x=>x.id==="demo-grocery-DAL1"),b=require("./after.json").products.find(x=>x.id==="demo-grocery-DAL1");if(!a||!b||a.quantity!==b.quantity)process.exit(1);console.log("D1 restock trigger confirmed: "+a.quantity+"->"+b.quantity)'
