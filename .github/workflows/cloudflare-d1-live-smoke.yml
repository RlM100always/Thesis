name: B-SMART Cloudflare D1 Read-only Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'frontend/src/api.js'
      - 'frontend/src/pages/Store.jsx'
      - '.github/workflows/cloudflare-d1-live-smoke.yml'

jobs:
  d1-live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      D1_API: https://bsmart-commerce-api.bcs-written-rakib.workers.dev
    steps:
      - name: Check Worker and public D1 catalogue counts
        run: |
          curl -fLsS --retry 4 --retry-delay 2 --max-time 18 "$D1_API/health" > health.json
          node -e 'const h=require("./health.json");if(h.database!=="Cloudflare D1"||h.scope!=="public_storefronts"||h.stores!==10||h.products!==259)process.exit(1);console.log("Public D1 catalogue: "+h.stores+" stores / "+h.products+" products")'
      - name: Check password authentication capability
        run: |
          curl -fLsS --max-time 25 "$D1_API/api/merchant/health" > merchant-health.json
          node -e 'const x=require("./merchant-health.json");if(!x.password_auth_ready||x.password_hash!=="PBKDF2-HMAC-SHA-256"||x.password_iterations!==100000||!x.legacy_access_key_support)process.exit(1);console.log("PBKDF2 merchant password authentication is ready")'
      - name: Verify Cloudflare CORS for B-SMART website
        run: |
          curl -fsSI --max-time 18 -X OPTIONS \
            -H "Origin: https://thesis-j0n8.onrender.com" \
            -H "Access-Control-Request-Method: POST" \
            "$D1_API/api/public/orders/demo-bsmart-grocery" > headers.txt
          grep -iq '^access-control-allow-origin: https://thesis-j0n8.onrender.com' headers.txt
          grep -iq '^access-control-allow-methods:.*POST' headers.txt
      - name: Check public store directory excludes retained CI fixture
        run: |
          curl -fLsS --retry 3 --max-time 18 "$D1_API/api/public/store/" > stores.json
          node -e 'const s=require("./stores.json");if(!Array.isArray(s)||s.length!==10||s.some(x=>!x.is_demo||!x.is_active||!x.slug)||s.some(x=>x.slug==="shop-752c1d2b-b92"))process.exit(1);console.log("Verified "+s.length+" public demo stores; retained CI data is hidden, not deleted")'
      - name: Check public D1 diagnostics
        run: |
          curl -fLsS --retry 3 --max-time 18 "$D1_API/api/public/store/diagnostics" > diagnostics.json
          node -e 'const x=require("./diagnostics.json");if(x.active_stores!==10||x.listed_products!==259||!x.catalog_ready)process.exit(1);console.log("D1 diagnostics match the public catalogue")'
      - name: Check individual catalogue and stock
        run: |
          curl -fLsS --retry 3 --max-time 18 "$D1_API/api/public/store/slug/demo-bsmart-grocery" > shop.json
          node -e 'const s=require("./shop.json");if(s.slug!=="demo-bsmart-grocery"||s.products.length<20||s.products.some(p=>typeof p.price!=="number"||typeof p.in_stock!=="boolean"))process.exit(1);console.log("Verified "+s.products.length+" grocery catalogue entries")'

# This workflow intentionally performs read-only checks against production D1.
# Write/checkout/POS scenarios belong in local D1 mocks or an isolated staging DB;
# never leave CI owners, orders, stock movements or cashbook rows in production.
