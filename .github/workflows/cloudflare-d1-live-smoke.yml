name: B-SMART Cloudflare D1 Read-only Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'frontend/src/api.js'
      - 'frontend/src/pages/Store.jsx'
      - '.github/workflows/cloudflare-d1-live-smoke.yml'

jobs:
  d1-live-read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      D1_API: https://bsmart-commerce-api.bcs-written-rakib.workers.dev
    steps:
      - name: Check Worker and verified public D1 catalogue counts
        run: |
          curl -fLsS --retry 4 --retry-delay 2 --max-time 18 "$D1_API/health" > health.json
          node -e 'const h=require("./health.json");if(h.database!=="Cloudflare D1"||h.scope!=="public_storefronts"||h.stores!==0||h.products!==0)process.exit(1);console.log("No verified owner-managed store is registered yet; unverified records remain private")'
      - name: Check password authentication capability
        run: |
          curl -fLsS --max-time 25 "$D1_API/api/merchant/health" > merchant-health.json
          node -e 'const x=require("./merchant-health.json");if(!x.password_auth_ready||x.password_hash!=="PBKDF2-HMAC-SHA-256"||x.password_iterations!==100000||!x.legacy_access_key_support)process.exit(1);console.log("PBKDF2 merchant password authentication is ready")'
      - name: Verify Cloudflare CORS for B-SMART website
        run: |
          curl -fsSI --max-time 18 -X OPTIONS \
            -H "Origin: https://thesis-j0n8.onrender.com" \
            -H "Access-Control-Request-Method: POST" \
            "$D1_API/api/public/orders/demo-bsmart-grocery" > headers.txt
          grep -iq '^access-control-allow-origin: https://thesis-j0n8.onrender.com' headers.txt
          grep -iq '^access-control-allow-methods:.*POST' headers.txt
      - name: Check public directory excludes all unverified records
        run: |
          curl -fLsS --retry 3 --max-time 18 "$D1_API/api/public/store/" > stores.json
          node -e 'const s=require("./stores.json");if(!Array.isArray(s)||s.length!==0)process.exit(1);console.log("Public directory contains no unverified or sample stores")'
      - name: Check live-only D1 diagnostics
        run: |
          curl -fLsS --retry 3 --max-time 18 "$D1_API/api/public/store/diagnostics" > diagnostics.json
          node -e 'const x=require("./diagnostics.json");if(x.active_stores!==0||x.listed_products!==0||x.catalog_ready)process.exit(1);console.log("Public counts exclude all unverified sample records")'
      - name: Check seeded stores are not publicly resolvable
        run: |
          status=$(curl -sS -o store.json -w '%{http_code}' --max-time 18 "$D1_API/api/public/store/slug/demo-bsmart-grocery")
          test "$status" = "404"
          status=$(curl -sS -o store.json -w '%{http_code}' --max-time 18 "$D1_API/api/public/store/slug/shop-752c1d2b-b92")
          test "$status" = "404"
          echo "Unverified stores cannot be opened directly"

# This workflow intentionally performs read-only checks against production D1.
# Write/checkout/POS scenarios belong in local D1 mocks or an isolated staging DB;
# never leave CI owners, orders, stock movements or cashbook rows in production.
