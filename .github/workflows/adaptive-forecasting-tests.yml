name: Adaptive forecasting research tests

on:
  push:
    branches:
      - research/adaptive-demand-forecasting-2026-11-07
  pull_request:
    branches:
      - main

jobs:
  forecasting-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && python -m pip install numpy pandas scikit-learn pytest
      - name: Run forecasting contract tests
        run: python -m pytest --confcutdir=research/forecasting research/forecasting/tests -q
      - name: Compile research module
        run: python -m compileall -q research/forecasting
