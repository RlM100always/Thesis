name: Adaptive forecasting and RQ2-RQ4 research tests

on:
  push:
    branches:
      - main
      - research/adaptive-demand-forecasting-2026-11-07
      - research/rq2-rq4-models-2026-11-23
  pull_request:
    branches:
      - main

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-research.txt
      - name: Run forecasting and decision-support contract tests
        run: python -m pytest research/forecasting/tests research/experiments/tests -q
      - name: Compile research modules
        run: python -m compileall -q research/forecasting research/experiments
      - name: Smoke-test research command line interfaces
        run: |
          python research/forecasting/rq1_shop_category_experiment.py --help
          python research/forecasting/audit_rq1_sources.py --help
          python research/forecasting/ablation_transaction_features.py --help
          python research/experiments/rq2_customer_prediction.py --help
          python research/experiments/rq2_customer_prediction_v2.py --help
          python research/experiments/rq3_policy_scenario_audit.py --help
          python research/experiments/rq4_explanation_audit.py --help
