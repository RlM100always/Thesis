name: Thesis UI screenshot evidence
on:
  push:
    branches:
      - research/thesis-ui-screenshot-evidence-2026-11-03
jobs:
  capture-operational-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.render.txt pytest playwright
          python -m playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Use bundled Chromium on Linux
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('e2e/conftest.py')
          s = p.read_text()
          s = s.replace('playwright.chromium.launch(channel="msedge", headless=True)',
                        'playwright.chromium.launch(headless=True)')
          p.write_text(s)
          PY
      - name: Capture real application screens with isolated demo records
        env:
          SHOTS_DIR: ${{ github.workspace }}/artifacts/screenshots
        run: python -m pytest e2e/test_thesis_screenshots.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thesis-operational-ui-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
