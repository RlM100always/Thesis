name: Build main thesis report PDF

on:
  push:
    branches: [main]
    paths:
      - 'thesis_report/main.tex'
      - 'thesis_report/logo.pdf'
      - 'thesis_report/Figures/**'
      - 'thesis_report/Chapters/**'
      - 'thesis_report/Appendices/**'
      - 'thesis_report/preamble.tex'
      - 'thesis_report/title.tex'
      - 'thesis_report/Bibliography.bib'
      - 'thesis_report/Thesis.cls'
      - 'thesis_report/*.sty'
      - '.github/workflows/build-main-thesis-report.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-thesis-report-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-science poppler-utils

      - name: Compile the existing main report
        working-directory: thesis_report
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          echo '--- PDF page count ---'
          pdfinfo main.pdf | grep -E '^(Pages|Page size|File size):'
          echo '--- LaTeX warnings ---'
          grep -n 'LaTeX Warning' main.log || true

      - name: Publish the compiled main report PDF
        run: |
          git fetch origin main
          git reset --hard origin/main
          cp thesis_report/main.pdf output/pdf/main-thesis-report.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pdf/main-thesis-report.pdf
          git diff --cached --quiet || (git commit -m "Build updated main thesis report PDF" && git push origin HEAD:main)
