name: Build main thesis report PDF

on:
  push:
    branches: [main, thesis-report-upgrade-2026-11-08]
    paths:
      - 'output/pdf/teachers-report-guidelines-template/Template/**'
      - '.github/workflows/build-main-thesis-report.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-thesis-report-pdf
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-science poppler-utils

      - name: Compile the teacher-template report
        working-directory: output/pdf/teachers-report-guidelines-template/Template
        run: |
          mkdir -p /tmp/teacher-template-build
          pdflatex -output-directory=/tmp/teacher-template-build -interaction=nonstopmode -halt-on-error main.tex
          bibtex /tmp/teacher-template-build/main
          pdflatex -output-directory=/tmp/teacher-template-build -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -output-directory=/tmp/teacher-template-build -interaction=nonstopmode -halt-on-error main.tex
          echo '--- PDF page count ---'
          pdfinfo /tmp/teacher-template-build/main.pdf | grep -E '^(Pages|Page size|File size):'
          echo '--- LaTeX warnings ---'
          grep -n 'LaTeX Warning' /tmp/teacher-template-build/main.log || true

      - name: Publish compiled report PDF
        run: |
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          cp /tmp/teacher-template-build/main.pdf output/pdf/main-thesis-report.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pdf/main-thesis-report.pdf
          git diff --cached --quiet || (git commit -m "Build updated teacher-template thesis report PDF" && git push origin HEAD:${{ github.ref_name }})

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: teacher-template-thesis-report
          path: output/pdf/main-thesis-report.pdf
          if-no-files-found: error
