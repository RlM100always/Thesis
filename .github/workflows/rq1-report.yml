name: Build RQ1 empirical development report
on:
  push:
    branches:
      - research/rq1-development-evidence-2026-11-08
    paths:
      - 'research/reports/**'
      - 'research/forecasting/**'
      - '.github/workflows/rq1-report.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rq1-report-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rq1-development-evidence-2026-11-08
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies and run tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-research.txt
          python -m pytest research/forecasting/tests -q
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-latex-extra
      - name: Compile report
        working-directory: research/reports
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error RQ1_Empirical_Development_Report.tex
          pdflatex -interaction=nonstopmode -halt-on-error RQ1_Empirical_Development_Report.tex
      - name: Commit PDF to research branch
        run: |
          git fetch origin research/rq1-development-evidence-2026-11-08
          git reset --hard origin/research/rq1-development-evidence-2026-11-08
          mkdir -p output/pdf
          cp research/reports/RQ1_Empirical_Development_Report.pdf output/pdf/RQ1_Empirical_Development_Report_2026-11-08.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pdf/RQ1_Empirical_Development_Report_2026-11-08.pdf
          git diff --cached --quiet || (git commit -m "Build RQ1 empirical development report PDF" && git push)
