name: B-SMART Storefront Recovery
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check public copy and dark/light contrast
        run: node --test tests/public-copy-theme.test.mjs
        working-directory: frontend
  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q api scripts/reconcile_existing_stores.py

  backend-integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite://"
      AUTH_MODE: "jwt"
      PRESENTATION_DEMO_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.render.txt
      - run: python -m pip install -r requirements.render.txt pytest
      - run: python -m pytest -q tests/test_full_storefront_restore.py tests/test_public_store_directory.py tests/test_online_orders.py tests/test_demo_catalog_bootstrap.py tests/test_theme_and_store_reconcile.py
      - run: alembic heads
