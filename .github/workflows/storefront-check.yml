name: B-SMART Storefront Recovery
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check public copy and dark/light contrast
        run: node --test tests/public-copy-theme.test.mjs tests/store-display-text.test.mjs tests/public-cms-display.test.mjs tests/d1-order-workflow.test.mjs
        working-directory: frontend
  d1-schema-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and exercise D1 schema migrations in SQLite
        run: python -c "import runpy; t=runpy.run_path('tests/test_cloudflare_d1_migrations.py'); t['test_all_d1_migrations_apply_in_order_and_create_commerce_tables'](); t['test_cancel_and_received_return_restore_stock_once'](); t['test_cod_payment_state_is_persisted_and_cancellation_is_not_marked_paid']()"
      - name: Validate Cloudflare Worker module syntax
        run: |
          set -euo pipefail
          for file in cloudflare/commerce-worker.js cloudflare/customer-routes.js cloudflare/merchant-routes.js cloudflare/platform-admin-routes.js cloudflare/order-workflow.js; do
            node --check --input-type=module < "$file"
          done

  backend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q api scripts/reconcile_existing_stores.py

  backend-integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite://"
      AUTH_MODE: "jwt"
      PRESENTATION_DEMO_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.render.txt
      - run: python -m pip install -r requirements.render.txt pytest
      - run: python -m pytest -q tests/test_full_storefront_restore.py tests/test_public_store_directory.py tests/test_online_orders.py tests/test_demo_catalog_bootstrap.py tests/test_theme_and_store_reconcile.py tests/test_store_customer_commerce.py
      - run: alembic heads
