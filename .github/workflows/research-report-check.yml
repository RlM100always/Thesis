name: Compile updated thesis research report

on:
  push:
    branches:
      - research/rq2-rq4-models-2026-11-23
    paths:
      - 'thesis_report/main.tex'
      - 'thesis_report/Chapters/**'
      - 'thesis_report/Figures/**'
      - 'thesis_report/preamble.tex'
      - 'thesis_report/title.tex'
      - 'thesis_report/Bibliography.bib'
      - 'thesis_report/Thesis.cls'
      - 'thesis_report/*.sty'
      - '.github/workflows/research-report-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'thesis_report/main.tex'
      - 'thesis_report/Chapters/**'
      - 'thesis_report/Figures/**'
      - 'thesis_report/preamble.tex'
      - 'thesis_report/title.tex'
      - 'thesis_report/Bibliography.bib'
      - 'thesis_report/Thesis.cls'
      - 'thesis_report/*.sty'
      - '.github/workflows/research-report-check.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-pictures texlive-science poppler-utils
      - name: Compile report
        working-directory: thesis_report
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdfinfo main.pdf | grep -E '^(Pages|Page size|File size):'
          if grep -nE 'LaTeX Warning: (Reference|Citation).*undefined|! LaTeX Error|Overfull \\\\hbox' main.log; then exit 1; fi
      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis-report-rq2-rq4-update
          path: thesis_report/main.pdf
          if-no-files-found: error
